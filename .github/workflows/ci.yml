name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  privacy:
    name: Privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Git history and npm package privacy
        run: node scripts/privacy-check.mjs --ci

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tests
        run: python3 tests/test_basic.py

  node:
    name: Node build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check and test packages
        run: |
          npm run build
          npm test
